<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waar ik nu aan werk</title>
<meta name="description" content="Een overzicht van de digitaliseringsprojecten waar ik momenteel aan werk.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --text: #1B1D1C;
    --text-muted: #6B6E68;
    --text-faint: #9A9D96;
    --border: #E3E1D8;
    --border-strong: #CFCCC0;
    --shadow: 0 2px 4px rgba(20,20,15,0.05), 0 10px 24px -10px rgba(20,20,15,0.16);
    --ink: #15202B;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #14161A;
      --surface: #1C1F23;
      --text: #ECEDE9;
      --text-muted: #A2A6A0;
      --text-faint: #74786F;
      --border: #33373A;
      --border-strong: #454A4C;
      --shadow: 0 2px 4px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }

  /* Validated categorical palette (8 hues, fixed order) - light / dark steps,
     with a pre-checked ink color per slot for AA contrast as a bold headline. */
  .tile-1{--tile-bg:#2a78d6;--tile-ink:#ffffff;}
  .tile-2{--tile-bg:#eb6834;--tile-ink:#15202b;}
  .tile-3{--tile-bg:#1baf7a;--tile-ink:#15202b;}
  .tile-4{--tile-bg:#eda100;--tile-ink:#15202b;}
  .tile-5{--tile-bg:#e87ba4;--tile-ink:#15202b;}
  .tile-6{--tile-bg:#008300;--tile-ink:#ffffff;}
  .tile-7{--tile-bg:#4a3aa7;--tile-ink:#ffffff;}
  .tile-8{--tile-bg:#e34948;--tile-ink:#ffffff;}
  @media (prefers-color-scheme: dark){
    .tile-1{--tile-bg:#3987e5;--tile-ink:#15202b;}
    .tile-2{--tile-bg:#d95926;--tile-ink:#15202b;}
    .tile-3{--tile-bg:#199e70;--tile-ink:#15202b;}
    .tile-4{--tile-bg:#c98500;--tile-ink:#15202b;}
    .tile-5{--tile-bg:#d55181;--tile-ink:#15202b;}
    .tile-6{--tile-bg:#008300;--tile-ink:#ffffff;}
    .tile-7{--tile-bg:#9085e9;--tile-ink:#15202b;}
    .tile-8{--tile-bg:#e66767;--tile-ink:#15202b;}
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    padding-inline:20px;
    padding-block:32px 60px;
  }
  .page{max-width:1080px;margin-inline:auto;}
  [hidden]{display:none!important;}

  .showcase-masthead{
    background:#F2E8D6;
    color:#15202B;
    border-radius:14px;
    padding:16px 24px;
    margin-bottom:14px;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }

  .showcase-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
    margin-top:24px;
  }
  .showcase-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .showcase-card:hover{transform:translateY(-3px);}
  .showcase-card-header{
    background:var(--tile-bg);
    color:var(--tile-ink);
    padding:30px 22px 24px;
  }
  .showcase-card-header h3{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:800;font-size:23px;margin:0;letter-spacing:-0.01em;
    line-height:1.15;text-wrap:balance;
  }
  .showcase-card-image{
    height:170px;background-size:cover;background-position:center;background-color:var(--border);
  }
  .showcase-card-body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .showcase-card-title{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:800;font-size:19px;margin:0;letter-spacing:-0.01em;color:var(--text);
  }
  .showcase-pitch{font-size:14px;line-height:1.6;color:var(--text);margin:0;white-space:pre-wrap;flex:1;}
  .showcase-pitch.empty{color:var(--text-faint);font-style:italic;}

  .showcase-empty{
    text-align:center;color:var(--text-muted);font-size:14px;padding:60px 20px;
    border:1px dashed var(--border-strong);border-radius:16px;
  }
  .showcase-loading{color:var(--text-faint);font-size:14px;}
</style>
</head>
<body>
<div class="page">
  <div class="showcase-masthead">BOOSTER digitale realisatie</div>

  <p class="showcase-loading" id="loadingState">Bezig met laden&hellip;</p>
  <p class="showcase-empty" id="emptyState" hidden>Nog geen projecten gemarkeerd voor de showcase.</p>
  <div class="showcase-grid" id="grid"></div>
</div>

<script>
  var SUPABASE_URL = "https://nqkfpuxtegepsugqjune.supabase.co";
  var SUPABASE_KEY = "sb_publishable_o2v6CMYOtqdLQZZl9R7raA_1aDBS9GG";
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var TILE_COUNT = 8;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function cardHTML(p, index){
    var tileCls = "tile-" + ((index % TILE_COUNT) + 1);
    var pitch = (p.showcase_pitch || "").trim();
    var pitchHTML = pitch
      ? '<p class="showcase-pitch">' + esc(pitch) + '</p>'
      : '<p class="showcase-pitch empty">Binnenkort meer hierover.</p>';

    var imageUrl = p.showcase_image_path
      ? supabaseClient.storage.from("showcase-images").getPublicUrl(p.showcase_image_path).data.publicUrl
      : null;

    var headerHTML = imageUrl
      ? '<div class="showcase-card-image" style="background-image:url(&quot;' + esc(imageUrl) + '&quot;)" role="img" aria-label="' + esc(p.name) + '"></div>'
      : '<div class="showcase-card-header ' + tileCls + '"><h3>' + esc(p.name) + '</h3></div>';
    var titleInBodyHTML = imageUrl ? '<h3 class="showcase-card-title">' + esc(p.name) + '</h3>' : '';

    return (
      '<article class="showcase-card">' +
        headerHTML +
        '<div class="showcase-card-body">' +
          titleInBodyHTML +
          pitchHTML +
        '</div>' +
      '</article>'
    );
  }

  async function load(){
    var loadingState = document.getElementById("loadingState");
    var emptyState = document.getElementById("emptyState");
    var grid = document.getElementById("grid");

    var res = await supabaseClient.from("showcase_projects").select("*").order("updated_at", {ascending:false});
    loadingState.hidden = true;

    var rows = res.data || [];
    if(res.error || rows.length === 0){
      emptyState.hidden = false;
      return;
    }
    grid.innerHTML = rows.map(cardHTML).join("");
  }

  load();
</script>
</body>
</html>
