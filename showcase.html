<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waar ik nu aan werk</title>
<meta name="description" content="Een overzicht van de digitaliseringsprojecten waar ik momenteel aan werk.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --text: #1B1D1C;
    --text-muted: #6B6E68;
    --text-faint: #9A9D96;
    --border: #E3E1D8;
    --border-strong: #CFCCC0;
    --shadow: 0 2px 4px rgba(20,20,15,0.05), 0 10px 24px -10px rgba(20,20,15,0.16);
    --ink: #15202B;
    color-scheme: light;
  }
  /* Deze pagina volgt bewust niet de donkere systeeminstelling - altijd
     hetzelfde lichte, pastelkleurige uiterlijk voor collega's. */

  /* Pastel decorative palette (8 hues, same fixed order as before). Purely
     decorative now - no text sits on these - so one soft set works in both
     themes, no per-mode or per-slot ink overrides needed. */
  .tile-1{--tile-bg:#C9DEF5;}
  .tile-2{--tile-bg:#F7DAC0;}
  .tile-3{--tile-bg:#C5EBDB;}
  .tile-4{--tile-bg:#FBE9B8;}
  .tile-5{--tile-bg:#F6D3E4;}
  .tile-6{--tile-bg:#D2E9C9;}
  .tile-7{--tile-bg:#DDD3F2;}
  .tile-8{--tile-bg:#F8D4D1;}

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(201,222,245,0.6), transparent 38%),
      radial-gradient(circle at 88% 12%, rgba(251,233,184,0.55), transparent 38%),
      radial-gradient(circle at 50% 105%, rgba(246,211,228,0.45), transparent 42%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    padding-inline:20px;
    padding-block:32px 60px;
  }
  .page{max-width:1080px;margin-inline:auto;}
  [hidden]{display:none!important;}

  .showcase-masthead{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:#F2E8D6;
    border-radius:16px;
    padding:16px 26px;
    margin-bottom:28px;
  }
  .masthead-brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .masthead-mark{width:14px;height:14px;border-radius:4px;background:#4a3aa7;flex:none;}
  .masthead-text{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-weight:800;font-size:20px;letter-spacing:0.01em;color:#15202B;
  }
  .masthead-sub{
    font-weight:500;font-size:12.5px;letter-spacing:0.08em;text-transform:uppercase;color:#6B6150;
  }
  .masthead-logo{height:44px;width:auto;flex:none;}

  .showcase-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
    margin-top:24px;
  }
  .showcase-card-featured{grid-column:span 2;}
  .showcase-card-featured .showcase-card-image,
  .showcase-card-featured .showcase-card-header{height:260px;}
  .showcase-card-featured .showcase-card-title{font-size:24px;}
  .showcase-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .showcase-card:hover{transform:translateY(-4px);box-shadow:0 4px 8px rgba(20,20,15,0.08), 0 16px 32px -12px rgba(20,20,15,0.22);}
  .showcase-card:focus{outline:2px solid var(--border-strong);outline-offset:2px;}
  .showcase-card-image-wrap{position:relative;}
  .showcase-card-header{
    height:180px;
    background:var(--tile-bg);
  }
  .showcase-card-image{
    height:180px;
    background:var(--tile-bg);
    display:flex;align-items:center;justify-content:center;
    padding:18px;
  }
  .showcase-card-image img{
    max-width:100%;max-height:100%;object-fit:contain;display:block;
  }
  .showcase-card-pitch-overlay{
    position:absolute;inset:0;
    background:rgba(246,244,238,0.96);
    display:flex;align-items:center;justify-content:center;
    padding:20px;text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .showcase-card:hover .showcase-card-pitch-overlay,
  .showcase-card:focus .showcase-card-pitch-overlay,
  .showcase-card:focus-within .showcase-card-pitch-overlay,
  .showcase-card:active .showcase-card-pitch-overlay{
    opacity:1;
    transform:translateY(0);
  }
  .showcase-overlay-text{
    margin:0;font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;
  }
  .showcase-overlay-text.empty{font-style:normal;color:#8a8276;font-size:13px;}
  .showcase-card-body{padding:16px 20px;}
  .showcase-card-title{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:800;font-size:21px;margin:0;letter-spacing:-0.02em;line-height:1.2;color:var(--text);
  }

  .showcase-empty{
    text-align:center;color:var(--text-muted);font-size:14px;padding:60px 20px;
    border:1px dashed var(--border-strong);border-radius:16px;
  }
  .showcase-loading{color:var(--text-faint);font-size:14px;}
</style>
</head>
<body>
<div class="page">
  <div class="showcase-masthead">
    <span class="masthead-brand">
      <span class="masthead-mark"></span>
      <span class="masthead-text">BOOSTER<span class="masthead-sub">digitale realisatie</span></span>
    </span>
    <img class="masthead-logo" src="assets/gemeente-utrecht-logo.webp" alt="Gemeente Utrecht">
  </div>

  <p class="showcase-loading" id="loadingState">Bezig met laden&hellip;</p>
  <p class="showcase-empty" id="emptyState" hidden>Nog geen projecten gemarkeerd voor de showcase.</p>
  <div class="showcase-grid" id="grid"></div>
</div>

<script>
  var SUPABASE_URL = "https://nqkfpuxtegepsugqjune.supabase.co";
  var SUPABASE_KEY = "sb_publishable_o2v6CMYOtqdLQZZl9R7raA_1aDBS9GG";
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var TILE_COUNT = 8;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function cardHTML(p, index){
    var tileCls = "tile-" + ((index % TILE_COUNT) + 1);
    var pitch = (p.showcase_pitch || "").trim();
    var pitchHTML = pitch
      ? '<p class="showcase-overlay-text">' + esc(pitch) + '</p>'
      : '<p class="showcase-overlay-text empty">&#10024; Meer info volgt binnenkort</p>';

    var imageUrl = p.showcase_image_path
      ? supabaseClient.storage.from("showcase-images").getPublicUrl(p.showcase_image_path).data.publicUrl
      : null;

    var mediaHTML = imageUrl
      ? '<div class="showcase-card-image ' + tileCls + '"><img src="' + esc(imageUrl) + '" alt="' + esc(p.name) + '"></div>'
      : '<div class="showcase-card-header ' + tileCls + '"></div>';

    var featured = index % 4 === 0;
    var cardCls = "showcase-card" + (featured ? " showcase-card-featured" : "");

    return (
      '<article class="' + cardCls + '" tabindex="0">' +
        '<div class="showcase-card-image-wrap">' +
          mediaHTML +
          '<div class="showcase-card-pitch-overlay">' + pitchHTML + '</div>' +
        '</div>' +
        '<div class="showcase-card-body">' +
          '<h3 class="showcase-card-title">' + esc(p.name) + '</h3>' +
        '</div>' +
      '</article>'
    );
  }

  async function load(){
    var loadingState = document.getElementById("loadingState");
    var emptyState = document.getElementById("emptyState");
    var grid = document.getElementById("grid");

    var res = await supabaseClient.from("showcase_projects").select("*").order("updated_at", {ascending:false});
    loadingState.hidden = true;

    var rows = res.data || [];
    if(res.error || rows.length === 0){
      emptyState.hidden = false;
      return;
    }
    grid.innerHTML = rows.map(cardHTML).join("");
  }

  load();
</script>
</body>
</html>
