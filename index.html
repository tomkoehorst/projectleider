<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projectradar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --text: #1B1D1C;
    --text-muted: #6B6E68;
    --text-faint: #9A9D96;
    --border: #E3E1D8;
    --border-strong: #CFCCC0;
    --accent: #285C58;
    --accent-strong: #1B403D;
    --accent-soft: rgba(40,92,88,0.09);
    --good: #2E7D4F;
    --good-bg: #E5F2E8;
    --warn: #A66A0C;
    --warn-bg: #FBEED9;
    --risk: #B23A2E;
    --risk-bg: #FBE7E3;
    --shadow: 0 1px 2px rgba(20,20,15,0.04), 0 6px 16px -8px rgba(20,20,15,0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #14161A;
      --surface: #1C1F23;
      --text: #ECEDE9;
      --text-muted: #A2A6A0;
      --text-faint: #74786F;
      --border: #33373A;
      --border-strong: #454A4C;
      --accent: #6FBBB3;
      --accent-strong: #8FD0C8;
      --accent-soft: rgba(111,187,179,0.12);
      --good: #6BC48D;
      --good-bg: rgba(107,196,141,0.14);
      --warn: #E3AA4C;
      --warn-bg: rgba(227,170,76,0.14);
      --risk: #E2837A;
      --risk-bg: rgba(226,131,122,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #14161A;
    --surface: #1C1F23;
    --text: #ECEDE9;
    --text-muted: #A2A6A0;
    --text-faint: #74786F;
    --border: #33373A;
    --border-strong: #454A4C;
    --accent: #6FBBB3;
    --accent-strong: #8FD0C8;
    --accent-soft: rgba(111,187,179,0.12);
    --good: #6BC48D;
    --good-bg: rgba(107,196,141,0.14);
    --warn: #E3AA4C;
    --warn-bg: rgba(227,170,76,0.14);
    --risk: #E2837A;
    --risk-bg: rgba(226,131,122,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    padding-inline:20px;
    padding-block:28px 60px;
  }
  .page{max-width:960px;margin-inline:auto;}
  [hidden]{display:none!important;}

  /* ---- auth screen ---- */
  .auth-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .auth-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:32px 28px;
    max-width:340px;
    width:100%;
    box-shadow:var(--shadow);
  }
  .auth-card h1{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
  }
  .auth-card .subtitle{margin:0 0 22px;color:var(--text-muted);font-size:13.5px;}
  .auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .auth-field label{font-size:12px;color:var(--text-muted);}
  .auth-field input{
    font-family:inherit;font-size:14px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:9px 10px;
    background:var(--surface);
    color:var(--text);
  }
  .auth-error{color:var(--risk);font-size:13px;margin:10px 0 0;min-height:1em;}
  .session-bar{
    display:flex;justify-content:flex-end;align-items:center;gap:10px;
    margin-bottom:8px;font-size:12.5px;color:var(--text-faint);
  }

  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  h1{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:-0.01em;
    margin:0 0 4px;
    text-wrap:balance;
  }
  .subtitle{margin:0;color:var(--text-muted);font-size:14px;}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .btn-primary.full{width:100%;}
  .btn-text{
    background:none;border:none;padding:0;
    font-family:inherit;font-size:13px;font-weight:500;
    color:var(--text-faint);cursor:pointer;
  }
  .btn-text:hover{color:var(--text-muted);}
  .btn-text.danger:hover{color:var(--risk);}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:visible;
    margin-bottom:20px;
  }
  .stat{background:var(--surface);padding:14px 16px;}
  .stat-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--text-faint);margin:0 0 6px;
  }
  .stat-value{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:22px;font-weight:500;margin:0;
  }
  .stat-value.risk{color:var(--risk);}
  .stat-value.warn{color:var(--warn);}
  .stat-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .list{
    display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .row{border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}

  .row-summary{
    display:flex;align-items:center;gap:14px;
    padding:12px 16px;cursor:pointer;flex-wrap:wrap;
  }
  .row-summary:hover{background:var(--accent-soft);}
  .row.expanded .row-summary{background:var(--accent-soft);}

  .health-slider-wrap{
    display:flex;align-items:center;gap:8px;
    flex:1 1 130px;min-width:120px;max-width:200px;
  }
  .health-slider{flex:1;width:100%;height:16px;margin:0;cursor:pointer;accent-color:var(--text-faint);}
  .health-label{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:11.5px;color:var(--text-muted);white-space:nowrap;min-width:2.4em;
  }

  .row-name{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:600;font-size:15.5px;
    flex:1 1 150px;min-width:110px;
  }
  .row-progress{
    display:flex;align-items:center;gap:8px;
    flex:1 1 130px;min-width:110px;max-width:180px;
  }
  .progress-track{flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:var(--text-faint);}
  .progress-label{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:11.5px;color:var(--text-muted);white-space:nowrap;
  }
  .row-milestone{
    flex:1 1 130px;min-width:110px;
    font-size:12.5px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row-milestone.date-urgent{color:var(--risk);font-weight:600;}
  .row-milestone.milestone-empty-inline{color:var(--text-faint);font-style:italic;}
  .row-chevron{flex:none;color:var(--text-faint);transition:transform .15s ease;margin-left:auto;}
  .row.expanded .row-chevron{transform:rotate(90deg);}

  .row-todo-preview{
    flex-basis:100%;display:flex;align-items:center;gap:5px;
    font-size:12.5px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row-todo-preview svg{flex:none;color:var(--text-faint);}
  .row-todo-more{color:var(--text-faint);}

  .row-detail{padding:4px 16px 18px 39px;display:flex;flex-direction:column;gap:12px;}

  .card-name{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:600;font-size:17px;margin:0;cursor:text;word-break:break-word;
  }
  .name-input{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:600;font-size:17px;
    border:1px solid var(--accent);
    border-radius:6px;padding:3px 6px;
    background:var(--surface);color:var(--text);width:100%;
  }
  .field-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--text-faint);margin:0 0 4px;
  }

  .milestone-view{cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px;}
  .milestone-view:hover{background:var(--accent-soft);}
  .milestone-text{font-size:14px;margin:0;}
  .milestone-date{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:12.5px;color:var(--text-muted);
  }
  .milestone-empty{font-size:13px;color:var(--text-faint);font-style:italic;}

  .milestone-edit{display:flex;flex-direction:column;gap:6px;}
  .milestone-edit input[type="text"], .milestone-edit input[type="date"]{
    font-family:inherit;font-size:13px;
    border:1px solid var(--border-strong);
    border-radius:6px;padding:6px 8px;
    background:var(--surface);color:var(--text);width:100%;
  }
  .btn-row{display:flex;gap:8px;margin-top:2px;}

  .todos{display:flex;flex-direction:column;gap:6px;}
  .todo-item{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;}
  .todo-item input[type="checkbox"]{margin-top:3px;accent-color:var(--accent);flex:none;}
  .todo-item span{flex:1;line-height:1.4;}
  .todo-item.done span{color:var(--text-faint);text-decoration:line-through;}
  .todo-del{
    flex:none;background:none;border:none;color:var(--text-faint);
    cursor:pointer;font-size:15px;line-height:1;padding:0 2px;
  }
  .todo-del:hover{color:var(--risk);}
  .todo-empty{font-size:13px;color:var(--text-faint);font-style:italic;}
  .todo-add{display:flex;gap:6px;margin-top:2px;}
  .todo-add input{
    flex:1;font-family:inherit;font-size:13px;
    border:1px solid var(--border);border-radius:6px;padding:6px 8px;
    background:var(--surface);color:var(--text);
  }
  .todo-add button{
    flex:none;background:var(--accent-soft);color:var(--accent);
    border:none;border-radius:6px;padding:0 12px;
    font-size:13px;font-weight:600;cursor:pointer;
  }

  .files-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
  .file-item{
    display:flex;align-items:center;gap:8px;
    font-size:13px;
  }
  .file-item .file-name{flex:1;word-break:break-word;}
  .file-item .file-size{color:var(--text-faint);font-size:11.5px;white-space:nowrap;}
  .file-empty{font-size:13px;color:var(--text-faint);font-style:italic;}
  .sessions-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
  .session-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:13px;
  }
  .session-item button{
    background:none;border:none;color:var(--accent);
    text-decoration:underline;cursor:pointer;font-size:13px;padding:0;
    text-align:left;
  }

  .note{
    font-family:inherit;font-size:13.5px;line-height:1.5;
    border:1px solid var(--border);border-radius:6px;padding:8px 10px;
    background:var(--surface);color:var(--text);resize:vertical;min-height:52px;width:100%;
  }
  .note:focus{border-color:var(--accent);outline:none;}
  .note::placeholder{color:var(--text-faint);}

  .row-footer{
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--border);padding-top:10px;
  }
  .updated-at{font-size:11.5px;color:var(--text-faint);}
  .confirm-delete{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);}

  .new-row{padding:14px 16px;}
  .new-row input[type="text"]{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-size:16px;
    border:1px solid var(--accent);border-radius:6px;padding:8px 10px;
    background:var(--surface);color:var(--text);width:100%;margin-bottom:8px;
  }

  .empty{text-align:center;color:var(--text-muted);font-size:14px;padding:40px 20px;}

  .ask-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .ask-card h2{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 10px;
  }
  .chat-toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin-bottom:10px;
  }
  .chat-toolbar select{
    font-family:inherit;font-size:12.5px;
    border:1px solid var(--border-strong);border-radius:6px;
    padding:5px 8px;background:var(--surface);color:var(--text);
    max-width:200px;
  }
  .deep-toggle{
    display:flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-muted);
    margin-top:8px;cursor:pointer;
  }
  .deep-toggle input{accent-color:var(--accent);}

  .chat-presets{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .attach-btn.recording{background:var(--risk-bg);color:var(--risk);}

  .daily-quote{
    border-left:3px solid var(--accent);
    padding:10px 16px;
    margin-bottom:20px;
    font-style:italic;
    font-size:14.5px;
    line-height:1.5;
    color:var(--text);
    background:var(--accent-soft);
    border-radius:0 8px 8px 0;
  }
  .quote-text{margin:0;}
  .quote-author-wrap{
    position:relative;
    display:inline-block;
    margin-top:6px;
    cursor:help;
  }
  .daily-quote .quote-author{
    display:block;
    font-style:normal;
    font-size:11px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
    border-bottom:1px dotted var(--text-faint);
  }
  .author-tooltip{
    position:absolute;bottom:100%;left:0;margin-bottom:8px;
    width:280px;max-width:80vw;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:12px 14px;
    font-style:normal;
    font-size:12.5px;
    line-height:1.5;
    color:var(--text);
    text-transform:none;
    letter-spacing:normal;
    z-index:30;
    opacity:0;visibility:hidden;
    transform:translateY(4px);
    transition:opacity .12s ease, transform .12s ease;
  }
  .quote-author-wrap:hover .author-tooltip,
  .quote-author-wrap:focus .author-tooltip,
  .quote-author-wrap:focus-within .author-tooltip{
    opacity:1;visibility:visible;transform:translateY(0);
  }

  .recap-banner{
    background:var(--accent-soft);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    font-size:13.5px;
    color:var(--text);
    margin-bottom:20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .recap-banner button{
    background:none;border:none;color:var(--text-faint);
    cursor:pointer;font-size:16px;line-height:1;padding:0;flex:none;
  }

  .mini-progress{height:5px;border-radius:999px;background:var(--border);margin-top:8px;overflow:hidden;}
  .mini-progress-fill{height:100%;background:var(--accent);border-radius:999px;}
  .score-qualifier{font-size:12px;color:var(--text-muted);margin-top:2px;}

  .score-tile{position:relative;cursor:help;}
  .score-tooltip{
    position:absolute;top:100%;right:0;margin-top:8px;
    width:270px;max-width:80vw;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:14px 16px;
    z-index:30;
    text-align:left;
    opacity:0;visibility:hidden;
    transform:translateY(-4px);
    transition:opacity .12s ease, transform .12s ease;
  }
  .score-tile:hover .score-tooltip,
  .score-tile:focus .score-tooltip,
  .score-tile:focus-within .score-tooltip{
    opacity:1;visibility:visible;transform:translateY(0);
  }
  .score-tooltip-title{font-size:12px;font-weight:600;margin:0 0 8px;}
  .score-tooltip-label{
    font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--text-faint);margin:8px 0 4px;
  }
  .score-tooltip ul{margin:0;padding-left:18px;}
  .score-tooltip li{font-size:12.5px;margin-bottom:2px;}
  .score-tooltip-ok{font-size:12.5px;color:var(--good);margin:4px 0;}
  .score-tooltip-tip{
    font-size:12.5px;color:var(--text-muted);
    margin:10px 0 0;padding-top:10px;
    border-top:1px solid var(--border);
  }
  .chat-log{
    display:flex;flex-direction:column;gap:10px;
    max-height:360px;overflow-y:auto;
    margin-bottom:12px;padding-right:2px;
  }
  .chat-msg{
    font-size:13.5px;line-height:1.5;white-space:pre-wrap;
    padding:8px 12px;border-radius:10px;max-width:88%;
  }
  .chat-msg.user{align-self:flex-end;background:var(--accent-soft);color:var(--text);}
  .chat-msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--border);color:var(--text);}
  .chat-msg.loading{color:var(--text-faint);font-style:italic;}
  .chat-msg.error{color:var(--risk);border-color:var(--risk-bg);}
  .ask-row{display:flex;gap:8px;flex-wrap:wrap;}
  .ask-row textarea{
    flex:1;min-width:200px;min-height:44px;resize:vertical;
    font-family:inherit;font-size:14px;
    border:1px solid var(--border-strong);
    border-radius:8px;padding:9px 10px;
    background:var(--surface);color:var(--text);
  }
  .attach-btn{
    flex:none;background:var(--accent-soft);color:var(--accent);
    border:none;border-radius:8px;padding:0 12px;
    font-size:16px;cursor:pointer;
  }
  .attached-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--text-muted);
    background:var(--accent-soft);border-radius:999px;
    padding:4px 10px;margin-bottom:8px;
  }
  .attached-chip button{
    background:none;border:none;color:var(--text-faint);
    cursor:pointer;font-size:14px;padding:0;line-height:1;
  }

  .nudge-icon{flex:none;}
  .footer-actions{display:flex;align-items:center;gap:14px;}

  .archive-toggle-btn{margin-top:14px;}
  .archive-list{
    margin-top:8px;border:1px solid var(--border);border-radius:10px;
    overflow:hidden;background:var(--surface);
  }
  .archive-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;border-bottom:1px solid var(--border);font-size:13.5px;
  }
  .archive-row:last-child{border-bottom:none;}
  .archive-name{color:var(--text-muted);text-decoration:line-through;}
  .archive-actions{display:flex;align-items:center;gap:12px;flex:none;}
</style>
</head>
<body>

<div class="page">

  <div id="authScreen" class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>Projectradar</h1>
      <p class="subtitle">Log in om je projectoverzicht te zien.</p>
      <div class="auth-field">
        <label for="authEmail">E-mailadres</label>
        <input type="email" id="authEmail" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="authPassword">Wachtwoord</label>
        <input type="password" id="authPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary full">Inloggen</button>
      <p class="auth-error" id="authError"></p>
    </form>
  </div>

  <div id="appScreen" hidden>
    <div class="session-bar">
      <span id="sessionEmail"></span>
      <button class="btn-text" id="logoutBtn" type="button">Uitloggen</button>
    </div>

    <div class="topbar">
      <div class="title-block">
        <h1>Projectradar</h1>
        <p class="subtitle">Digitaliseringsprojecten · gemeente Utrecht</p>
      </div>

  function uid(){
    try { return crypto.randomUUID(); } catch(e){ return String(Date.now()) + Math.random().toString(16).slice(2); }
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    if(parts.length !== 3) return iso;
    var d = parseInt(parts[2],10), m = parseInt(parts[1],10)-1;
    if(isNaN(d) || isNaN(m) || !MONTHS[m]) return iso;
    return d + " " + MONTHS[m];
  }

  function relTime(iso){
    if(!iso) return "";
    var then = new Date(iso).getTime();
    if(isNaN(then)) return "";
    var diffMs = Date.now() - then;
    var mins = Math.round(diffMs/60000);
    if(mins < 1) return "zojuist bijgewerkt";
    if(mins < 60) return "bijgewerkt " + mins + " min geleden";
    var hours = Math.round(mins/60);
    if(hours < 24) return "bijgewerkt " + hours + " uur geleden";
    var days = Math.round(hours/24);
    if(days < 30) return "bijgewerkt " + days + (days===1 ? " dag" : " dagen") + " geleden";
    return "bijgewerkt op " + fmtDate(iso.slice(0,10));
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function daysUntil(iso){
    var t = todayISO().split("-").map(Number);
    var todayUTC = Date.UTC(t[0], t[1]-1, t[2]);
    var p = iso.split("-").map(Number);
    var targetUTC = Date.UTC(p[0], p[1]-1, p[2]);
    return Math.round((targetUTC - todayUTC) / 86400000);
  }

  function daysSince(iso){
    if(!iso) return null;
    var then = new Date(iso).getTime();
    if(isNaN(then)) return null;
    return Math.floor((Date.now() - then) / 86400000);
  }

  function milestoneSummary(p){
    if(p.milestone_date){
      var days = daysUntil(p.milestone_date);
      var label;
      if(days === 0) label = "vandaag";
      else if(days === 1) label = "morgen";
      else if(days === -1) label = "gisteren";
      else if(days > 1) label = "over " + days + " dagen";
      else label = Math.abs(days) + " dagen te laat";
      return {text: label, urgent: days <= 3, title: p.milestone_text || fmtDate(p.milestone_date)};
    }
    if(p.milestone_text) return {text: p.milestone_text, urgent:false, title:""};
    return {text:"Geen mijlpaal", urgent:false, empty:true, title:""};
  }

      info.start = el.selectionStart;
      info.end = el.selectionEnd;

    return info;

    if(!info) return;
    var el = document.getElementById(info.id);

    el.focus();
    if(typeof info.start === "number" && typeof el.setSelectionRange === "function"){
      try{ el.setSelectionRange(info.start, info.end); }catch(e){}
    }
  }

      : '<button class="btn-text" data-action="ask-delete" data-id="' + id + '">Verwijderen</button>';

  function fmtBytes(n){
    if(n == null) return "";
    if(n < 1024) return n + " B";
    if(n < 1024*1024) return Math.round(n/1024) + " KB";
    return (n/1024/1024).toFixed(1) + " MB";
  }

      : "";

    var todoPreview = "";

          '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>' +
          esc(openTodos[0].text) +
          (openTodos.length > 1 ? ' <span class="row-todo-more">+' + (openTodos.length - 1) + ' meer</span>' : '') +
        '</span>';
    }

    var summary =
      '<div class="row-summary" data-action="toggle-expand" data-id="' + id + '">' +
        '<span class="row-name">' + esc(p.name) + '</span>' +
        '<span class="health-slider-wrap">' +
          '<input type="range" class="health-slider" min="0" max="100" step="1" value="' + h + '" style="accent-color:' + bucket.color + '" data-action="health-slider" data-id="' + id + '" id="health-' + id + '" aria-label="Status ' + esc(p.name) + '">' +
          '<span class="health-label" id="health-label-' + id + '" title="' + esc(bucket.label) + '">' + h + '%</span>' +
          nudgeIcon +
        '</span>' +
        '<span class="row-progress">' +
          '<span class="progress-track"><span class="progress-fill" style="width:' + pct + '%;background:' + bucket.color + '"></span></span>' +
          '<span class="progress-label">' + (total ? (done + '/' + total) : '&ndash;') + '</span>' +
        '</span>' +
        '<span class="row-milestone' + (ms.urgent ? ' date-urgent' : '') + (ms.empty ? ' milestone-empty-inline' : '') + '" title="' + esc(ms.title) + '">' + esc(ms.text) + '</span>' +
        '<svg class="row-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        todoPreview +
      '</div>';

    var detail = ui.expanded ? detailHTML(id, p, ui, todos) : "";

    return '<article class="row' + (ui.expanded ? ' expanded' : '') + '" data-id="' + id + '">' + summary + detail + '</article>';

  function render(){
    var focus = saveFocus();
    renderStats();
    emptyState.hidden = activeDocs().length > 0 || showAddForm;
    grid.innerHTML = newRowHTML() + sortedDocs().map(rowHTML).join("");
    renderArchive();
    populateProjectSelects();
    restoreFocus(focus);

      var el = document.getElementById("new-project-name");
      if(el && document.activeElement !== el && !focus) el.focus();

  function getData(id){
    return docs.find(function(d){ return d.id === id; }) || null;
  }
  function touch(extra){
    extra = extra || {};
    extra.updated_at = new Date().toISOString();
    return extra;
  }

  async function loadProjects(){
    var res = await supabaseClient.from("projects").select("*").order("sort_order", {ascending:true});
    if(res.error){ offlineState.hidden = false; return; }
    offlineState.hidden = true;
    if(res.data.length === 0 && !seeded){
      seeded = true;
      await supabaseClient.from("projects").insert(STARTERS);
      res = await supabaseClient.from("projects").select("*").order("sort_order", {ascending:true});
    }
    docs = res.data || [];
  }

  async function updateProject(id, patch){
    await supabaseClient.from("projects").update(patch).eq("id", id);
    await loadProjects();
    render();
  }
  async function deleteProject(id){
    await supabaseClient.from("projects").delete().eq("id", id);
    await loadProjects();
    render();
  }
  async function addProject(row){
    await supabaseClient.from("projects").insert(row);
    await loadProjects();
    render();
  }

  function onGridClick(e){
    var actionEl = e.target.closest("[data-action]");
    if(!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    var id = actionEl.getAttribute("data-id");

    if(action === "toggle-expand"){
      uiState[id] = Object.assign({}, uiState[id], {expanded: !(uiState[id] && uiState[id].expanded)});
      render();
      return;
    }
    if(action === "edit-name"){
      uiState[id] = Object.assign({}, uiState[id], {editName:true});
      render();
      var input = document.getElementById("name-input-" + id);
      if(input){ input.focus(); input.select(); }
      return;
    }
    if(action === "edit-milestone"){
      uiState[id] = Object.assign({}, uiState[id], {editMilestone:true});
      render();
      return;
    }
    if(action === "cancel-milestone"){
      uiState[id] = Object.assign({}, uiState[id], {editMilestone:false});
      render();
      return;
    }
    if(action === "save-milestone"){
      var textEl = document.getElementById("milestone-text-" + id);
      var dateEl = document.getElementById("milestone-date-" + id);
      updateProject(id, touch({
        milestone_text: textEl ? textEl.value.trim() : "",
        milestone_date: (dateEl && dateEl.value) ? dateEl.value : null
      }));
      uiState[id] = Object.assign({}, uiState[id], {editMilestone:false});
      return;
    }
    if(action === "add-todo"){
      var input = document.getElementById("todo-input-" + id);
      var text = input ? input.value.trim() : "";
      if(!text) return;
      var cur = getData(id);
      var todos = (cur && Array.isArray(cur.todos)) ? cur.todos.slice() : [];
      todos.push({id: uid(), text: text, done: false});
      updateProject(id, touch({todos: todos}));
      if(input) input.value = "";
      return;
    }
    if(action === "delete-todo"){
      var todoId = actionEl.getAttribute("data-todo");
      var cur = getData(id);
      var todos = (cur && Array.isArray(cur.todos)) ? cur.todos.filter(function(t){ return t.id !== todoId; }) : [];
      updateProject(id, touch({todos: todos}));
      return;
    }
    if(action === "ask-delete"){
      uiState[id] = Object.assign({}, uiState[id], {confirmDelete:true});
      render();
      return;
    }
    if(action === "cancel-delete"){
      uiState[id] = Object.assign({}, uiState[id], {confirmDelete:false});
      render();
      return;
    }
    if(action === "confirm-delete"){
      deleteProject(id);
      return;
    }
    if(action === "archive-project"){
      updateProject(id, touch({archived: true}));
      return;
    }
    if(action === "unarchive-project"){
      updateProject(id, touch({archived: false}));
      return;
    }
    if(action === "toggle-archive"){
      archiveOpen = !archiveOpen;
      render();
      return;
    }
    if(action === "upload-file"){
      uploadTargetProjectId = id;
      document.getElementById("projectFileInput").click();
      return;
    }
    if(action === "download-file"){
      var fileId = actionEl.getAttribute("data-file-id");
      var file = allFiles.find(function(f){ return f.id === fileId; });
      if(!file) return;
      supabaseClient.storage.from("project-files").createSignedUrl(file.storage_path, 3600).then(function(res){
        if(res.data && res.data.signedUrl) window.open(res.data.signedUrl, "_blank");
      });
      return;
    }
    if(action === "ask-delete-file"){
      var fid1 = actionEl.getAttribute("data-file-id");
      uiState["file-" + fid1] = Object.assign({}, uiState["file-" + fid1], {confirmDelete:true});
      render();
      return;
    }
    if(action === "cancel-delete-file"){
      var fid2 = actionEl.getAttribute("data-file-id");
      uiState["file-" + fid2] = Object.assign({}, uiState["file-" + fid2], {confirmDelete:false});
      render();
      return;
    }
    if(action === "confirm-delete-file"){
      var fid3 = actionEl.getAttribute("data-file-id");
      var delFile = allFiles.find(function(f){ return f.id === fid3; });
      if(delFile){
        supabaseClient.storage.from("project-files").remove([delFile.storage_path]).then(function(){
          return supabaseClient.from("project_files").delete().eq("id", fid3);
        }).then(function(){
          return loadProjectFiles();
        }).then(render);
      }
      return;
    }
    if(action === "open-session"){
      openSession(actionEl.getAttribute("data-session-id"));
      return;
    }
    if(action === "create-project"){
      submitNewProject();
      return;
    }
    if(action === "cancel-new"){
      showAddForm = false;
      render();
      return;
    }
  }

  function onGridChange(e){
    var t = e.target;
    if(t.matches('[data-action="toggle-todo"]')){
      var id = t.getAttribute("data-id");
      var todoId = t.getAttribute("data-todo");
      var cur = getData(id);
      var todos = (cur && Array.isArray(cur.todos)) ? cur.todos.map(function(x){
        return x.id === todoId ? Object.assign({}, x, {done: t.checked}) : x;
      }) : [];
      updateProject(id, touch({todos: todos}));
      return;
    }
    if(t.matches('[data-action="health-slider"]')){
      var id2 = t.getAttribute("data-id");
      var val = parseInt(t.value, 10);
      var cur2 = getData(id2);
      if(cur2 && getHealth(cur2) === val) return;
      updateProject(id2, touch({health: val}));
    }
  }

  function applyHealthLive(id, val){
    var bucket = healthBucket(val);
    var label = document.getElementById("health-label-" + id);
    if(label){ label.textContent = val + "%"; label.title = bucket.label; }
    var slider = document.getElementById("health-" + id);
    if(slider) slider.style.accentColor = bucket.color;
    var fill = grid.querySelector('.row[data-id="' + id + '"] .progress-fill');
    if(fill) fill.style.background = bucket.color;
  }

  function onGridBlur(e){
    var t = e.target;
    if(t.id && t.id.indexOf("note-") === 0){
      var id = t.getAttribute("data-id");
      clearTimeout(noteTimers[id]);
      var val = t.value;
      var cur = getData(id);
      if(cur && cur.note === val) return;
      updateProject(id, touch({note: val}));
      return;
    }
    if(t.id && t.id.indexOf("name-input-") === 0){
      var id2 = t.getAttribute("data-id");
      var val2 = t.value.trim();
      if(val2){
        var cur2 = getData(id2);
        if(!cur2 || cur2.name !== val2) updateProject(id2, touch({name: val2}));
      }
      uiState[id2] = Object.assign({}, uiState[id2], {editName:false});
      render();
    }
  }

  function onGridKeydown(e){
    if(e.target.id && e.target.id.indexOf("name-input-") === 0 && e.key === "Enter"){
      e.target.blur();
    }
    if(e.target.id && e.target.id.indexOf("todo-input-") === 0 && e.key === "Enter"){
      var id = e.target.getAttribute("id").replace("todo-input-", "");
      var input = e.target;
      var text = input.value.trim();
      if(!text) return;
      var cur = getData(id);
      var todos = (cur && Array.isArray(cur.todos)) ? cur.todos.slice() : [];
      todos.push({id: uid(), text: text, done: false});
      updateProject(id, touch({todos: todos}));
      input.value = "";
    }
    if(e.target.id === "new-project-name" && e.key === "Enter"){
      submitNewProject();
    }
  }

  function onGridInput(e){
    var t = e.target;
    if(t.matches && t.matches('[data-action="health-slider"]')){
      applyHealthLive(t.getAttribute("data-id"), parseInt(t.value, 10));
      return;
    }
    if(t.id && t.id.indexOf("note-") === 0){
      var id = t.getAttribute("data-id");
      clearTimeout(noteTimers[id]);
      var val = t.value;
      noteTimers[id] = setTimeout(function(){
        var cur = getData(id);
        if(cur && cur.note === val) return;
        updateProject(id, touch({note: val}));
      }, 1200);
    }
  }

  function submitNewProject(){
    var input = document.getElementById("new-project-name");
    var name = input ? input.value.trim() : "";
    if(!name) return;
    var maxOrder = docs.reduce(function(m,d){ return typeof d.sort_order === "number" && d.sort_order > m ? d.sort_order : m; }, 0);
    addProject({
      name: name,
      health: 75,
      milestone_text: "",
      milestone_date: null,
      todos: [],
      note: "",
      sort_order: maxOrder + 1
    });
    showAddForm = false;
  }

  function populateProjectSelects(){
    var current = sessionProjectSelect.value;
    sessionProjectSelect.innerHTML = '<option value="">Geen project</option>' + docs.map(function(d){
      return '<option value="' + d.id + '">' + esc(d.name) + '</option>';
    }).join("");
    sessionProjectSelect.value = current;
  }

  async function loadSessions(){
    var res = await supabaseClient.from("chat_sessions").select("*").order("updated_at", {ascending:false});
    allSessions = res.data || [];
    sessionSelect.innerHTML = '<option value="">&mdash; Nieuw gesprek &mdash;</option>' + allSessions.map(function(s){
      return '<option value="' + s.id + '">' + esc(s.title) + '</option>';
    }).join("");
    sessionSelect.value = currentSessionId || "";
  }

  function openSession(id){
    var found = allSessions.find(function(s){ return s.id === id; });
    if(!found) return;
    currentSessionId = found.id;
    chatHistory = found.messages || [];
    sessionSelect.value = found.id;
    sessionProjectSelect.value = found.project_id || "";
    renderChat();
    document.querySelector(".ask-card").scrollIntoView({behavior:"smooth", block:"start"});
  }

  sessionSelect.addEventListener("change", function(){
    var id = sessionSelect.value;
    if(!id){
      currentSessionId = null;
      chatHistory = [];
      sessionProjectSelect.value = "";
      renderChat();
      return;
    }
    openSession(id);
  });

  newSessionBtn.addEventListener("click", function(){
    currentSessionId = null;
    chatHistory = [];
    stagedFile = null;
    showAttachedChip();
    sessionSelect.value = "";
    sessionProjectSelect.value = "";
    renderChat();
  });

  var deleteSessionBtn = document.getElementById("deleteSessionBtn");
  deleteSessionBtn.addEventListener("click", async function(){
    if(!currentSessionId){
      window.alert("Selecteer eerst een opgeslagen gesprek om te verwijderen.");
      return;
    }
    if(!window.confirm("Dit gesprek definitief verwijderen?")) return;
    await supabaseClient.from("chat_sessions").delete().eq("id", currentSessionId);
    currentSessionId = null;
    chatHistory = [];
    sessionProjectSelect.value = "";
    await loadSessions();
    render();
    renderChat();
  });

  saveSessionBtn.addEventListener("click", async function(){
    var cleanHistory = chatHistory.filter(function(m){ return !m.pending; });
    if(cleanHistory.length === 0) return;
    var projectId = sessionProjectSelect.value || null;
    if(currentSessionId){
      await supabaseClient.from("chat_sessions").update({
        messages: cleanHistory,
        project_id: projectId,
        updated_at: new Date().toISOString()
      }).eq("id", currentSessionId);
    } else {
      var firstMsg = cleanHistory[0];
      var suggestion = firstMsg.display || (typeof firstMsg.content === "string" ? firstMsg.content : "Gesprek");
      var title = window.prompt("Naam voor dit gesprek:", suggestion.slice(0, 40));
      if(!title) return;
      var res = await supabaseClient.from("chat_sessions").insert({title: title, messages: cleanHistory, project_id: projectId}).select().single();
      if(res.data) currentSessionId = res.data.id;
    }
    await loadSessions();
  });

  function renderChat(){
    chatLog.innerHTML = chatHistory.map(function(m){
      var cls = "chat-msg " + m.role + (m.pending ? " loading" : "") + (m.error ? " error" : "");
      var text = typeof m.content === "string" ? m.content : (m.display || "[bijlage]");
      return '<div class="' + cls + '">' + esc(text) + '</div>';
    }).join("");
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result.split(",")[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function fileToText(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  function showAttachedChip(){
    if(!stagedFile){ attachedChip.hidden = true; attachedChip.innerHTML = ""; return; }
    attachedChip.hidden = false;
    attachedChip.innerHTML = "&#128206; " + esc(stagedFile.name) + ' <button type="button" id="removeAttachBtn">&times;</button>';
    document.getElementById("removeAttachBtn").addEventListener("click", function(){
      stagedFile = null;
      showAttachedChip();
    });
  }

  attachBtn.addEventListener("click", function(){ fileInput.click(); });

  var micBtn = document.getElementById("micBtn");
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  if(SpeechRecognitionCtor){
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "nl-NL";
    recognition.interimResults = false;
    recognition.continuous = false;
    recognition.onresult = function(e){
      var text = e.results[0][0].transcript;
      askInput.value = (askInput.value ? askInput.value.trim() + " " : "") + text;
      askInput.focus();
    };
    recognition.onend = function(){ micBtn.classList.remove("recording"); };
    recognition.onerror = function(){ micBtn.classList.remove("recording"); };
    micBtn.addEventListener("click", function(){
      micBtn.classList.add("recording");
      try{ recognition.start(); }catch(e){ micBtn.classList.remove("recording"); }
    });
  } else {
    micBtn.hidden = true;
  }

  var weekUpdateBtn = document.getElementById("weekUpdateBtn");
  weekUpdateBtn.addEventListener("click", function(){
    askInput.value = "Doe een weekupdate-ronde met me: loop kort langs al mijn actieve projecten en vraag me per project of er iets veranderd is (status, mijlpaal, to do's, notitie). Verwerk mijn antwoorden direct met de tools.";
    askForm.requestSubmit();
  });

  var meetingNotesBtn = document.getElementById("meetingNotesBtn");
  meetingNotesBtn.addEventListener("click", function(){
    askInput.value = "Dit is een vergaderverslag/notitie. Haal er per project de relevante updates uit (status, mijlpalen, to do's, besluiten) en verwerk die direct met de tools. Geef daarna een korte samenvatting van wat je hebt aangepast.";
    askInput.focus();
  });

  fileInput.addEventListener("change", async function(){
    var file = fileInput.files[0];
    fileInput.value = "";
    if(!file) return;
    var MAX_BYTES = 8 * 1024 * 1024;
    if(file.size > MAX_BYTES){
      window.alert("Bestand is te groot (max 8MB).");
      return;
    }
    var type = file.type;
    if(type === "application/pdf"){
      stagedFile = {name: file.name, kind:"document", mediaType: type, data: await fileToBase64(file)};
    } else if(type.indexOf("image/") === 0){
      stagedFile = {name: file.name, kind:"image", mediaType: type, data: await fileToBase64(file)};
    } else if(type === "text/plain" || /\.txt$/i.test(file.name)){
      stagedFile = {name: file.name, kind:"text", data: await fileToText(file)};
    } else {
      window.alert("Dit bestandstype wordt nog niet ondersteund. Gebruik PDF, een afbeelding (png/jpg) of platte tekst (.txt).");
      return;
    }
    showAttachedChip();
  });

  var projectFileInput = document.getElementById("projectFileInput");
  projectFileInput.addEventListener("change", async function(){
    var file = projectFileInput.files[0];
    projectFileInput.value = "";
    if(!file || !uploadTargetProjectId || !currentUserId) return;
    var MAX_BYTES = 20 * 1024 * 1024;
    if(file.size > MAX_BYTES){
      window.alert("Bestand is te groot (max 20MB).");
      return;
    }
    var path = currentUserId + "/" + uploadTargetProjectId + "/" + Date.now() + "_" + file.name;
    var upRes = await supabaseClient.storage.from("project-files").upload(path, file);
    if(upRes.error){
      window.alert("Upload mislukt: " + upRes.error.message);
      return;
    }
    await supabaseClient.from("project_files").insert({
      project_id: uploadTargetProjectId,
      file_name: file.name,
      storage_path: path,
      size_bytes: file.size
    });
    await loadProjectFiles();
    render();
  });

  askForm.addEventListener("submit", async function(e){
    e.preventDefault();
    var text = askInput.value.trim();
    if(!text && !stagedFile) return;
    askInput.value = "";

    var contentBlocks = [];
    var displayText = text;
    if(stagedFile){
      if(stagedFile.kind === "document"){
        contentBlocks.push({type:"document", source:{type:"base64", media_type: stagedFile.mediaType, data: stagedFile.data}, cache_control:{type:"ephemeral"}});
      } else if(stagedFile.kind === "image"){
        contentBlocks.push({type:"image", source:{type:"base64", media_type: stagedFile.mediaType, data: stagedFile.data}, cache_control:{type:"ephemeral"}});
      } else if(stagedFile.kind === "text"){
        contentBlocks.push({type:"text", text: "[Bestand: " + stagedFile.name + "]\n" + stagedFile.data});
      }
      displayText = "📎 " + stagedFile.name + (text ? ("\n" + text) : "");
    }
    contentBlocks.push({type:"text", text: text || "Analyseer dit bestand."});

    chatHistory.push({role:"user", content: contentBlocks, display: displayText});
    chatHistory.push({role:"assistant", content:"Bezig met nadenken...", pending:true});
    stagedFile = null;
    showAttachedChip();
    renderChat();

    var btn = askForm.querySelector('button[type="submit"]');
    btn.disabled = true;
    var apiMessages = chatHistory.filter(function(m){ return !m.pending; }).map(function(m){
      return {role: m.role, content: m.content};
    });
    var useSonnet = document.getElementById("deepToggle").checked;
    var res = await supabaseClient.functions.invoke("hyper-action", {body: {messages: apiMessages, useSonnet: useSonnet}});
    btn.disabled = false;
    chatHistory.pop();

    if(res.error || (res.data && res.data.error)){
      chatHistory.push({role:"assistant", content:"Er ging iets mis. Probeer het opnieuw.", error:true});
    } else {
      chatHistory.push({role:"assistant", content: (res.data && res.data.answer) ? res.data.answer : "Geen antwoord ontvangen."});
      await loadProjects();
      render();
    }
    renderChat();
  });

  askInput.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      askForm.requestSubmit();
    }
  });

  function showAuthScreen(){
    authScreen.hidden = false;
    appScreen.hidden = true;
  }

  function enterApp(session){
    authScreen.hidden = true;
    appScreen.hidden = false;
    sessionEmail.textContent = session && session.user ? session.user.email : "";
    currentUserId = session && session.user ? session.user.id : null;
    loadProjects().then(render).then(loadAndRenderRecap);
    loadSessions().then(render);
    loadProjectFiles().then(render);
  }

  supabaseClient.auth.onAuthStateChange(function(event, session){
    if(session){ enterApp(session); } else { showAuthScreen(); }
  });

  renderDailyQuote();
})();
</script>
</body>
</html>
